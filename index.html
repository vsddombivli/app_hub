<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vardhman Sanskar Dham — App Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --ink:#201a17;
    --canvas:#fbf8f2;
    --maroon:#7a1e2b;
    --maroon-dim:#8f3341;
    --marigold:#e1a73b;
    --teal:#1f3d3a;
    --sand:#e4dcc8;
    --card:#ffffff;
    --shadow: 0 1px 2px rgba(32,26,23,.06), 0 8px 24px -12px rgba(32,26,23,.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--sand);
    background:
      radial-gradient(1200px 300px at 20% -60%, rgba(225,167,59,.12), transparent),
      var(--canvas);
  }
  .brand{
    display:flex; align-items:center; gap:14px; max-width:1100px; margin:0 auto;
  }
  .brand-mark{
    width:44px;height:44px;border-radius:12px 12px 4px 12px;
    background:linear-gradient(160deg, var(--maroon), var(--maroon-dim));
    display:flex;align-items:center;justify-content:center;color:var(--marigold);
    flex:none;
  }
  .brand h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; letter-spacing:.2px;
  }
  .brand p{ margin:2px 0 0; font-size:13px; color:#6b6058; }
  #crumbBar{
    max-width:1100px;margin:14px auto 0; display:none; align-items:center; gap:6px;
    font-size:13px; color:#6b6058;
  }
  #crumbBar button{
    background:none;border:none;font:inherit;color:var(--maroon);cursor:pointer;padding:2px 4px;
    border-radius:6px;
  }
  #crumbBar button:hover{background:var(--sand);}
  #crumbBar .sep{color:#c9bfae;}
  main{ max-width:1100px; margin:0 auto; padding:28px 20px 80px; }
  .category{ margin-bottom:34px; }
  .category-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:14px;
  }
  .category-head h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin:0; color:var(--teal);
  }
  .category-head .rule{ flex:1; height:1px; background:var(--sand); }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;
  }
  .tile{
    background:var(--card);
    border:1px solid var(--sand);
    border-radius:16px 16px 6px 16px;
    padding:18px 14px;
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    cursor:pointer; text-decoration:none; color:inherit;
    box-shadow:var(--shadow);
    transition:transform .12s ease, border-color .12s ease;
    min-height:108px;
    position:relative;
  }
  .tile:hover{ transform:translateY(-2px); border-color:var(--marigold); }
  .tile:focus-visible{ outline:2px solid var(--maroon); outline-offset:2px; }
  .tile .icon-wrap{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(160deg, rgba(122,30,43,.08), rgba(225,167,59,.16));
    display:flex;align-items:center;justify-content:center;color:var(--maroon);
  }
  .tile .icon-wrap svg{ width:20px;height:20px; }
  .tile .name{ font-weight:600; font-size:14.5px; line-height:1.3; }
  .tile .folder-badge{
    position:absolute; top:12px; right:12px; color:#a9a094;
  }
  .tile .folder-badge svg{ width:15px;height:15px; }
  #empty{
    text-align:center; padding:60px 20px; color:#8a7f73;
  }
  #empty .icon-wrap{ margin:0 auto 12px; width:48px;height:48px; }
  footer{
    text-align:center; padding:20px; font-size:12px; color:#a9a094;
  }
  @media (max-width:420px){
    .grid{ grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l7 6v12H5V8l7-6z"/></svg>
    </div>
    <div>
      <h1>Vardhman Sanskar Dham</h1>
      <p>Volunteer app hub — everything in one place</p>
    </div>
  </div>
  <div id="crumbBar"></div>
</header>

<main id="main">
  <p style="text-align:center;color:#a9a094;padding:60px 0;">Loading…</p>
</main>

<footer>Configuration is managed by the admin team · vsd-hub</footer>

<script>
// ====== CONFIGURE THESE ======
const SUPABASE_URL = "https://npaikbbvarcsxykmogeo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wYWlrYmJ2YXJjc3h5a21vZ2VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNTcxNzIsImV4cCI6MjA5OTkzMzE3Mn0.zwIfRfHttsYmATkl751GWa1VJE2qUgN5Jxq53tNYSpM";
// ==============================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  db: { schema: 'vsd_hub' }
});
const main = document.getElementById('main');
const crumbBar = document.getElementById('crumbBar');

let allTiles = [];
let stack = []; // stack of tile ids representing current drill-down path

function iconSvg(name){
  const key = (name || 'app-window').trim();
  const el = document.createElement('div');
  el.innerHTML = `<i data-lucide="${key}"></i>`;
  return el.innerHTML;
}

function childrenOf(id){
  return allTiles
    .filter(t => t.parent_id === id)
    .sort((a,b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name));
}

function categories(){
  const roots = allTiles.filter(t => t.parent_id === null);
  const cats = [...new Set(roots.map(t => t.category))];
  return cats.sort((a,b)=>a.localeCompare(b));
}

function renderCrumbs(){
  if(stack.length === 0){ crumbBar.style.display = 'none'; crumbBar.innerHTML=''; return; }
  crumbBar.style.display = 'flex';
  const path = [{id:null,label:'All apps'}, ...stack.map(id => ({id, label: allTiles.find(t=>t.id===id)?.name || ''}))];
  crumbBar.innerHTML = path.map((p,i) => {
    const isLast = i === path.length-1;
    const label = isLast ? `<strong style="color:var(--ink)">${p.label}</strong>` : `<button data-jump="${i}">${p.label}</button>`;
    return i === 0 ? label : `<span class="sep">/</span>${label}`;
  }).join('');
  crumbBar.querySelectorAll('button[data-jump]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.jump,10);
      stack = idx === 0 ? [] : stack.slice(0, idx);
      render();
    });
  });
}

function tileEl(tile){
  const isFolder = !tile.url;
  const wrapper = document.createElement(isFolder ? 'div' : 'a');
  wrapper.className = 'tile';
  wrapper.tabIndex = 0;
  if(!isFolder){
    wrapper.href = tile.url;
    wrapper.target = '_blank';
    wrapper.rel = 'noopener';
  }
  wrapper.innerHTML = `
    <div class="icon-wrap">${iconSvg(tile.icon)}</div>
    <div class="name">${escapeHtml(tile.name)}</div>
    ${isFolder ? `<div class="folder-badge"><i data-lucide="corner-down-right"></i></div>` : ''}
  `;
  if(isFolder){
    wrapper.addEventListener('click', ()=>{ stack.push(tile.id); render(); });
    wrapper.addEventListener('keydown', e=>{ if(e.key==='Enter'){ stack.push(tile.id); render(); } });
  }
  return wrapper;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  renderCrumbs();
  main.innerHTML = '';

  if(stack.length === 0){
    // top level: group by category
    const cats = categories();
    if(cats.length === 0){
      main.innerHTML = `<div id="empty"><div class="icon-wrap" style="background:var(--sand);color:#a9a094;"><i data-lucide="inbox"></i></div>No apps configured yet.</div>`;
      lucide.createIcons();
      return;
    }
    cats.forEach(cat=>{
      const section = document.createElement('div');
      section.className = 'category';
      section.innerHTML = `<div class="category-head"><h2>${escapeHtml(cat)}</h2><div class="rule"></div></div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      const tiles = allTiles.filter(t=>t.parent_id===null && t.category===cat)
        .sort((a,b)=> a.sort_order - b.sort_order || a.name.localeCompare(b.name));
      tiles.forEach(t => grid.appendChild(tileEl(t)));
      section.appendChild(grid);
      main.appendChild(section);
    });
  } else {
    const currentId = stack[stack.length-1];
    const kids = childrenOf(currentId);
    const grid = document.createElement('div');
    grid.className = 'grid';
    if(kids.length === 0){
      main.innerHTML = `<div id="empty"><div class="icon-wrap" style="background:var(--sand);color:#a9a094;"><i data-lucide="inbox"></i></div>Nothing inside this yet.</div>`;
      lucide.createIcons();
      return;
    }
    kids.forEach(t => grid.appendChild(tileEl(t)));
    main.appendChild(grid);
  }
  lucide.createIcons();
}

async function load(){
  const { data, error } = await sb.from('tiles').select('*');
  if(error){
    main.innerHTML = `<div id="empty">Couldn't load apps: ${escapeHtml(error.message)}</div>`;
    return;
  }
  allTiles = data;
  render();
}

load();
</script>
</body>
</html>
